
services:
  - type: web
    name: council-ai-v13
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_v20:app --host 0.0.0.0 --port 10000
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_URL
        value: https://api.mistral.ai/v1
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1
      - key: OPENROUTER_API_URL
        value: https://openrouter.ai/api/v1
