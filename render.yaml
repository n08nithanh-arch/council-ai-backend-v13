services:
  - type: web
    name: council-ai-backend-v13
    env: python
    region: singapore
    plan: free
    buildCommand: |
      if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r requirements; fi
    startCommand: uvicorn main_v20:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
