
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Council AI V20 - V14.8 FINAL - Dual Flow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif} body{background:#0A0D12} ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:#fff2;border-radius:10px}</style>
</head>
<body class="text-white min-h-screen">
<div id="root"><div class="grid place-items-center h-screen"><div class="text-white/50">Đang tải Council AI V20... Nếu đen màn hình, bấm Ctrl+F5</div></div></div>
<script type="text/babel">
const {useState,useEffect} = React;

const PERSONNEL = {
  classic_5: [
    {id:"analyst",name:"Analyst",aspect:"Phân tích logic",color:"#3B82F6",model:"gpt-4o-mini"},
    {id:"creator",name:"Creator",aspect:"Sáng tạo đột phá",color:"#8B5CF6",model:"claude-3-5-sonnet-20241022"},
    {id:"critic",name:"Critic",aspect:"Phản biện",color:"#EF4444",model:"gpt-4o-mini"},
    {id:"empath",name:"Empath",aspect:"Con người",color:"#10B981",model:"claude-3-5-sonnet-20241022"},
    {id:"executor",name:"Executor",aspect:"Thực thi MVP",color:"#F59E0B",model:"gpt-4o-mini"},
  ],
  expand_pool: [
    {name:"Chuyên gia Kỹ thuật",aspect:"Kiến trúc, scalability",color:"#3B82F6"},
    {name:"Chuyên gia Thị trường",aspect:"PMF, đối thủ",color:"#8B5CF6"},
    {name:"Chuyên gia Tài chính",aspect:"Chi phí, ROI",color:"#10B981"},
    {name:"Chuyên gia Người dùng",aspect:"UX, JTBD",color:"#F59E0B"},
    {name:"Chuyên gia Đạo đức & Pháp lý",aspect:"Đạo đức, pháp lý",color:"#EF4444"},
    {name:"Chuyên gia Dữ liệu",aspect:"Metrics, data",color:"#06B6D4"},
    {name:"Chuyên gia Vận hành",aspect:"SOP, triển khai",color:"#84CC16"},
    {name:"Chuyên gia Sáng tạo",aspect:"Ý tưởng đột phá",color:"#EC4899"},
    {name:"Chuyên gia Tăng trưởng",aspect:"Growth, marketing",color:"#6366F1"},
    {name:"Chuyên gia Bảo mật",aspect:"Bảo mật, privacy",color:"#14B8A6"},
  ]
};

function App(){
  const [flow,setFlow]=useState(1);
  const [topic,setTopic]=useState("Làm sao build startup AI 2 người trong 30 ngày đạt 10k MRR?");
  const [desired,setDesired]=useState(7);
  const [rounds,setRounds]=useState(2);
  const [council,setCouncil]=useState([]);
  const [messages,setMessages]=useState([]);
  const [synth,setSynth]=useState("");
  const [final,setFinal]=useState("");
  const [loading,setLoading]=useState(false);
  const [personnel,setPersonnel]=useState(PERSONNEL);

  const genCouncil=()=>{
    const pool = personnel.expand_pool;
    const shuffled = [...pool].sort(()=>0.5-Math.random()).slice(0,desired);
    const c = shuffled.map((r,i)=>({id:`auto_${i}`,name:r.name,aspect:r.aspect,color:r.color,model:Math.random()>0.5?'gpt-4o-mini':'claude-3-5-sonnet-20241022'}));
    setCouncil(c);
  };

  useEffect(()=>{
    fetch('/personnel').then(r=>r.json()).then(d=>{if(d.classic_5) setPersonnel(d);}).catch(()=>{});
  },[]);
  useEffect(()=>{genCouncil();},[desired]);

  const callFlow1=async()=>{
    if(!topic.trim()) return;
    setLoading(true); setMessages([]); setSynth(""); setFinal("");
    try{
      const res = await fetch('/flow1/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,desired_count:desired,custom_roles:council})});
      const data = await res.json();
      setCouncil(data.council||council);
      for(const m of data.messages){setMessages(p=>[...p,m]); await new Promise(r=>setTimeout(r,300));}
      setSynth(data.synthesis||"");
    }catch(e){
      console.log(e);
      for(const m of council){setMessages(p=>[...p,{member_name:m.name,aspect:m.aspect,color:m.color,content:`[${m.name}] Phân tích cho "${topic}": Từ góc nhìn ${m.aspect}, tôi thấy 2 rủi ro và 1 cơ hội...`} ]); await new Promise(r=>setTimeout(r,200));}
      setSynth(`TỔNG HỢP cho "${topic}": Hội đồng ${desired} chuyên gia đồng thuận MVP 7 ngày...`);
    }finally{setLoading(false);}
  };

  const callFlow2=async()=>{
    if(!topic.trim()) return;
    setLoading(true); setMessages([]); setSynth(""); setFinal("");
    try{
      const res = await fetch('/flow2/debate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,rounds})});
      const data = await res.json();
      for(const m of data.messages){setMessages(p=>[...p,{...m,member_name:m.member_name,aspect:m.role||m.aspect,color:m.color}]); await new Promise(r=>setTimeout(r,300));}
      setFinal(data.final_conclusion||"");
    }catch(e){
      for(let r=1;r<=rounds;r++){for(const m of personnel.classic_5){setMessages(p=>[...p,{round:r,member_name:m.name,aspect:m.aspect,color:m.color,content:`[Vòng ${r}] ${m.name}: Góc nhìn về "${topic}"...`}]); await new Promise(r=>setTimeout(r,100));}}
      setFinal(`Kết luận sau ${rounds} vòng về "${topic}": MVP 7 ngày...`);
    }finally{setLoading(false);}
  };

  return (
    <div className="min-h-screen bg-[#0A0D12]">
      <header className="sticky top-0 z-20 border-b border-white/10 bg-[#0A0D12]/90 backdrop-blur">
        <div className="max-w-[1280px] mx-auto px-4 h-[64px] flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl bg-white text-black font-black grid place-items-center">C</div>
            <div>
              <div className="font-bold leading-none">Council AI V20</div>
              <div className="text-[11px] text-white/50">V14.8 FINAL Flat • Dual Flow • Sáng 3/9</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <a href="/docs" target="_blank" className="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs">API Docs</a>
            <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
          </div>
        </div>
      </header>

      <div className="max-w-[1280px] mx-auto px-4 py-6">
        <div className="flex justify-center mb-6">
          <div className="inline-flex p-1 rounded-2xl bg-white/[0.06] border border-white/10">
            <button onClick={()=>setFlow(1)} className={`px-5 py-2.5 rounded-xl text-sm font-semibold ${flow===1?'bg-white text-black':'text-white/60'}`}>⚡ Flow 1: Mở Rộng</button>
            <button onClick={()=>setFlow(2)} className={`px-5 py-2.5 rounded-xl text-sm font-semibold ${flow===2?'bg-white text-black':'text-white/60'}`}>⚔️ Flow 2: 5 Vai</button>
          </div>
        </div>

        <div className="grid lg:grid-cols-[380px_1fr] gap-5">
          <aside className="rounded-[20px] bg-[#0E121A] border border-white/10 p-4 h-fit">
            {flow===1?(
              <div>
                <div className="flex justify-between mb-3"><span className="font-semibold text-sm">HỘI ĐỒNG {council.length} người</span><button onClick={genCouncil} className="text-xs px-2 py-1 rounded-full bg-white/10">🔧 Sinh lại</button></div>
                <div className="mb-4"><div className="flex justify-between text-xs text-white/50"><span>Số lượng</span><span className="text-white">{desired}</span></div><input type="range" min="3" max="12" value={desired} onChange={e=>setDesired(parseInt(e.target.value))} className="w-full mt-2 accent-white"/></div>
                <div className="space-y-2 max-h-[460px] overflow-auto pr-1">
                  {council.map((c,i)=><div key={i} className="flex gap-3 p-3 rounded-xl bg-white/[0.04] border border-white/5"><div className="w-9 h-9 rounded-full grid place-items-center text-white text-xs font-bold shrink-0" style={{background:c.color}}>{c.name[0]}</div><div className="flex-1 min-w-0"><div className="text-sm font-medium truncate">{c.name}</div><div className="text-[11px] text-white/50 truncate">{c.aspect}</div></div></div>)}
                </div>
              </div>
            ):(
              <div>
                <div className="font-semibold text-sm mb-3">5 VAI CỐ ĐỊNH</div>
                <div className="space-y-2">
                  {personnel.classic_5.map(m=><div key={m.id} className="flex gap-3 p-3 rounded-xl bg-white/[0.04] border border-white/5"><div className="w-10 h-10 rounded-full grid place-items-center text-white font-bold" style={{background:m.color}}>{m.name[0]}</div><div><div className="text-sm font-medium">{m.name}</div><div className="text-xs text-white/50">{m.aspect}</div></div></div>)}
                </div>
                <div className="mt-4"><div className="flex justify-between text-xs text-white/50"><span>Vòng</span><span className="text-white">{rounds}</span></div><input type="range" min="1" max="4" value={rounds} onChange={e=>setRounds(parseInt(e.target.value))} className="w-full mt-2 accent-white"/></div>
              </div>
            )}
          </aside>

          <main className="space-y-4">
            <div className="rounded-[20px] bg-white/[0.06] border border-white/10 p-4">
              <textarea value={topic} onChange={e=>setTopic(e.target.value)} className="w-full bg-transparent outline-none text-[15px] resize-none" rows="3" placeholder="Nhập chủ đề..."/>
              <div className="flex justify-end pt-3"><button onClick={flow===1?callFlow1:callFlow2} disabled={loading||!topic.trim()} className="px-6 py-2.5 rounded-xl bg-white text-black text-sm font-bold disabled:opacity-40">{loading?'Đang gọi API...':flow===1?'Phân tích đa chiều →':'Bắt đầu tranh luận →'}</button></div>
            </div>

            <div className="space-y-3">
              {messages.map((m,i)=><div key={i} className="rounded-[18px] border p-4" style={{borderColor:m.color+'40', background:m.color+'15'}}><div className="flex items-center gap-2"><div className="w-7 h-7 rounded-full grid place-items-center text-white text-[11px] font-bold" style={{background:m.color}}>{(m.member_name||'?')[0]}</div><span className="font-semibold text-sm">{m.member_name}</span>{m.round&&<span className="text-[11px] px-2 py-0.5 rounded-full bg-white/10 ml-2">Vòng {m.round}</span>}<span className="ml-auto text-[11px] text-white/40">{m.aspect}</span></div><div className="mt-2 text-[14px] whitespace-pre-wrap">{m.content}</div></div>)}
            </div>

            {(synth||final)&&<div className="rounded-[20px] bg-white text-black p-6"><div className="font-bold mb-2">🏁 {flow===1?'Tổng hợp đa chiều':'Kết luận cuối cùng'}</div><div className="whitespace-pre-wrap text-sm">{synth||final}</div></div>}
          </main>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
