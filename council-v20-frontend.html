
<!DOCTYPE html>

<body class="bg-[#0A0D12] text-white min-h-screen">

<script type="importmap">{"imports":{"react":"https://esm.sh/react@18.2.0","react-dom":"https://esm.sh/react-dom@18.2.0/client"}}</script>
<script type="module">
import React, {useState,useEffect} from 'react';
import {createRoot} from 'react-dom/client';
const h = React.createElement;

const FALLBACK_PERSONNEL = {
  classic_5: [
    {id:"analyst",name:"Analyst",role:"Phân tích logic",aspect:"Dữ liệu, logic, rủi ro",color:"#3B82F6",model:"gpt-4o-mini"},
    {id:"creator",name:"Creator",role:"Sáng tạo đột phá",aspect:"Ý tưởng mới, khác biệt",color:"#8B5CF6",model:"claude-3-5-sonnet-20241022"},
    {id:"critic",name:"Critic",role:"Phản biện sắc bén",aspect:"Tìm lỗ hổng, thách thức",color:"#EF4444",model:"gpt-4o-mini"},

    {id:"executor",name:"Executor",role":"Thực thi",aspect:"Triển khai MVP, thực tế",color:"#F59E0B",model:"gpt-4o-mini"},

    {name:"Chuyên gia Thị trường",aspect:"PMF, đối thủ, xu hướng",color:"#8B5CF6"},
    {name:"Chuyên gia Tài chính",aspect:"Chi phí, ROI, pricing",color:"#10B981"},
    {name:"Chuyên gia Người dùng",aspect:"UX, Jobs-to-be-Done, pain",color:"#F59E0B"},
    {name:"Chuyên gia Đạo đức & Pháp lý",aspect:"Đạo đức, pháp lý, compliance",color:"#EF4444"},
    {name:"Chuyên gia Dữ liệu",aspect:"Metrics, đo lường, data",color:"#06B6D4"},
    {name:"Chuyên gia Vận hành",aspect:"SOP, triển khai, hiring",color:"#84CC16"},
    {name:"Chuyên gia Sáng tạo",aspect:"Ý tưởng đột phá, viral",color:"#EC4899"},
    {name:"Chuyên gia Tăng trưởng",aspect:"Growth, marketing, funnel",color:"#6366F1"},
    {name:"Chuyên gia Bảo mật",aspect:"Bảo mật, privacy, trust",color:"#14B8A6"},
  ]
};

function App(){
  const [flow,setFlow]=useState(1);
  const [topic,setTopic]=useState("Làm sao build startup AI 2 người trong 30 ngày đạt 10k MRR?");
  const [context,setContext]=useState("");

    genCouncil();
  },[]);

  const genCouncil=()=>{
    const pool = personnel.expand_pool || FALLBACK_PERSONNEL.expand_pool;

    const c = shuffled.map((r,i)=>({id:`auto_${i}_${Date.now()}`,name:r.name,aspect:r.aspect,color:r.color||'#3B82F6',model:Math.random()>0.5?'gpt-4o-mini':'claude-3-5-sonnet-20241022'}));
    setCouncil(c);
  };

  useEffect(()=>{genCouncil();},[desired, personnel]);

  const callFlow1=async()=>{
    if(!topic.trim()) return;
    setLoading(true); setMessages([]); setSynth(""); setFinal("");
    try{
      const res = await fetch('/flow1/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,context,desired_count:desired,custom_roles:council})});
      const data = await res.json();
      setCouncil(data.council || council);
      for(const m of data.messages){setMessages(p=>[...p,m]); await new Promise(r=>setTimeout(r,300));}
      setSynth(data.synthesis);
    }catch(e){
      for(const m of council){setMessages(p=>[...p,{member_name:m.name,aspect:m.aspect,color:m.color,content:`[${m.name}] Phân tích cho "${topic}": Từ góc nhìn ${m.aspect}, tôi thấy 2 rủi ro chính và 1 cơ hội đột phá...`} ]); await new Promise(r=>setTimeout(r,250));}
      setSynth(`TỔNG HỢP cho "${topic}": Hội đồng ${desired} chuyên gia đồng thuận tập trung MVP 7 ngày, test PMF với 10 users đầu...`);
    }finally{setLoading(false);}
  };

  const callFlow2=async()=>{
    if(!topic.trim()) return;
    setLoading(true); setMessages([]); setSynth(""); setFinal("");
    try{
      const res = await fetch('/flow2/debate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,context,rounds})});
      const data = await res.json();
      for(const m of data.messages){setMessages(p=>[...p,{...m,member_name:m.member_name,aspect:m.role||m.aspect,color:m.color}]); await new Promise(r=>setTimeout(r,300));}
      setFinal(data.final_conclusion);
    }catch(e){
      for(let r=1;r<=rounds;r++){for(const m of personnel.classic_5){setMessages(p=>[...p,{round:r,member_name:m.name,aspect:m.aspect,color:m.color,content:`[Vòng ${r}] ${m.name}: Từ góc nhìn ${m.aspect} về "${topic}"...`} ]); await new Promise(r=>setTimeout(r,150));}}
      setFinal(`Kết luận sau ${rounds} vòng tranh luận về "${topic}": Đồng thuận MVP 7 ngày, bất đồng về pricing, cần test 10 users...`);
    }finally{setLoading(false);}
  };

  return h('div',null,
    h('header',{className:'sticky top-0 z-20 border-b border-white/10 bg-[#0A0D12]/80 backdrop-blur-xl'},
      h('div',{className:'max-w-[1280px] mx-auto px-4 h-[64px] flex items-center justify-between'},
        h('div',{className:'flex items-center gap-3'},
          h('div',{className:'w-9 h-9 rounded-xl bg-white text-black font-black grid place-items-center text-[16px]'},'C'),
          h('div',null,
            h('div',{className:'font-bold leading-none'},'Council AI V20'),
            h('div',{className:'text-[11px] text-white/50 mt-1'},'V14.8 FINAL Flat • Dual Flow • Sang 3/9/2026')
          ),
          h('div',{className:'ml-6 hidden md:flex items-center gap-2 text-[11px]'},
            h('span',{className:'px-2 py-1 rounded-full bg-white/10 border border-white/10'},'data/personnel.json'),
            h('span',{className:'px-2 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300'},'Local Memory 78KB')
          )
        ),
        h('div',{className:'flex items-center gap-2'},
          h('a',{href:'/docs',target:'_blank',className:'px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs hover:bg-white/10'},'API Docs'),
          h('div',{className:'w-2 h-2 rounded-full bg-emerald-400 animate-pulse'})
        )
      )
    ),
    h('div',{className:'max-w-[1280px] mx-auto px-4 py-6'},
      h('div',{className:'flex justify-center'},
        h('div',{className:'inline-flex p-1 rounded-2xl bg-white/[0.06] border border-white/10'},
          h('button',{onClick:()=>setFlow(1),className:`px-5 py-2.5 rounded-xl text-sm font-semibold transition ${flow===1?'bg-white text-black shadow':'text-white/60 hover:text-white'}`},'⚡ Flow 1: Mở Rộng Tự Động'),
          h('button',{onClick:()=>setFlow(2),className:`px-5 py-2.5 rounded-xl text-sm font-semibold transition ${flow===2?'bg-white text-black shadow':'text-white/60 hover:text-white'}`},'⚔️ Flow 2: 5 Vai Tranh Luận')
        )
      ),
      h('div',{className:'mt-6 grid lg:grid-cols-[380px_1fr] gap-5'},
        h('aside',{className:'space-y-4'},
          h('div',{className:'rounded-[20px] bg-[#0E121A] border border-white/10 p-4'},
            flow===1?h('div',null,
              h('div',{className:'flex items-center justify-between mb-3'},h('div',{className:'font-semibold text-sm'},'CẤU HÌNH HỘI ĐỒNG'),h('span',{className:'text-[11px] px-2 py-0.5 rounded-full bg-white/10'},`${council.length} thành viên`)),
              h('div',{className:'space-y-3'},
                h('div',null,h('div',{className:'flex justify-between text-xs text-white/50'},h('span',null,'Số lượng chuyên gia'),h('span',{className:'text-white font-medium'},desired)),h('input',{type:'range',min:3,max:12,value:desired,onChange:e=>setDesired(parseInt(e.target.value)),className:'w-full mt-2 accent-white'})),
                h('button',{onClick:genCouncil,className:'w-full py-2.5 rounded-xl bg-white text-black text-sm font-semibold hover:bg-white/90'},'🔧 Tự động sinh hội đồng'),
                h('div',{className:'pt-3 space-y-2 max-h-[420px] overflow-auto pr-1'},...council.map((c,i)=>h('div',{key:i,className:'group flex gap-3 p-3 rounded-xl bg-white/[0.04] border border-white/5 hover:bg-white/[0.06] hover:border-white/10 transition'},h('div',{className:'w-9 h-9 rounded-full grid place-items-center text-white text-xs font-bold shrink-0',style:{background:c.color}},c.name[0]),h('div',{className:'min-w-0 flex-1'},h('div',{className:'text-sm font-medium truncate'},c.name),h('div',{className:'text-[11px] text-white/50 truncate'},c.aspect),h('div',{className:'mt-1 inline-flex text-[10px] px-1.5 py-0.5 rounded-full bg-white/10 border border-white/10'},c.model))))),
                h('div',{className:'mt-4 p-3 rounded-xl bg-amber-500/10 border border-amber-500/20'},h('div',{className:'text-xs font-medium text-amber-200'},'💡 Flat structure'),h('div',{className:'text-[11px] text-amber-200/70 mt-1'},'Dùng data/personnel.json local như sáng 3/9, tự sinh đa khía cạnh theo topic'))
              )
            ):h('div',null,
              h('div',{className:'font-semibold text-sm mb-3'},'5 VAI CỐ ĐỊNH (Classic)'),
              h('div',{className:'space-y-2'},...personnel.classic_5.map(m=>h('div',{key:m.id,className:'flex gap-3 p-3 rounded-xl bg-white/[0.04] border border-white/5'},h('div',{className:'w-10 h-10 rounded-full grid place-items-center text-white font-bold shrink-0',style:{background:m.color}},m.name[0]),h('div',{className:'flex-1 min-w-0'},h('div',{className:'font-medium text-sm'},m.name),h('div',{className:'text-xs text-white/50 truncate'},m.aspect),h('div',{className:'text-[10px] mt-1 text-white/40'},m.model))))),
              h('div',{className:'mt-4'},h('div',{className:'flex justify-between text-xs text-white/50'},h('span',null,'Số vòng tranh luận'),h('span',{className:'text-white font-medium'},rounds)),h('input',{type:'range',min:1,max:4,value:rounds,onChange:e=>setRounds(parseInt(e.target.value)),className:'w-full mt-2 accent-white'}))
            )
          )
        ),
        h('main',{className:'space-y-4'},
          h('div',{className:'rounded-[20px] bg-white/[0.06] border border-white/10 p-4'},
            h('div',{className:'text-[11px] text-white/40 uppercase tracking-widest font-semibold mb-2'},'Chủ đề phân tích'),
            h('textarea',{value:topic,onChange:e=>setTopic(e.target.value),placeholder:'Nhập chủ đề...',className:'w-full bg-transparent outline-none text-[15px] leading-relaxed resize-none placeholder:text-white/30',rows:3}),
            context!==undefined&&h('textarea',{value:context,onChange:e=>setContext(e.target.value),placeholder:'Bối cảnh thêm (optional)...',className:'mt-3 w-full bg-white/[0.04] border border-white/10 rounded-xl px-3 py-2 outline-none text-[13px] placeholder:text-white/30 resize-none',rows:2}),
            h('div',{className:'flex justify-between items-center pt-3'},
              h('div',{className:'text-[11px] text-white/30'},flow===1?`Flow 1 • ${desired} chuyên gia đa khía cạnh`:`Flow 2 • ${personnel.classic_5.length} vai • ${rounds} vòng`),
              h('button',{onClick:flow===1?callFlow1:callFlow2,disabled:loading||!topic.trim(),className:'px-5 py-2.5 rounded-xl bg-white text-black text-sm font-semibold hover:bg-white/90 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2'},loading&&h('span',{className:'w-4 h-4 border-2 border-black/20 border-t-black rounded-full animate-spin'}),loading?'Đang gọi API thật...':flow===1?'Phân tích đa chiều →':'Bắt đầu tranh luận →')
            )
          ),
          h('div',{className:'space-y-3'},
            ...messages.map((m,i)=>h('div',{key:i,className:'group rounded-[18px] border p-4 transition hover:translate-y-[-1px]',style:{borderColor:m.color+'40',background:`linear-gradient(180deg, ${m.color}15, ${m.color}06)`}},
              h('div',{className:'flex items-center gap-2.5'},
                h('div',{className:'w-7 h-7 rounded-full grid place-items-center text-white text-[11px] font-bold shrink-0',style:{background:m.color}},(m.member_name||'?')[0]),
                h('div',{className:'font-semibold text-sm'},m.member_name),
                m.round&&h('span',{className:'text-[11px] px-2 py-0.5 rounded-full bg-white/10 border border-white/10 text-white/60'},`Vòng ${m.round}`),
                h('div',{className:'ml-auto text-[11px] text-white/40 truncate max-w-[160px]'},m.aspect),
                h('div',{className:'text-[10px] px-1.5 py-0.5 rounded-full bg-black/30 border border-white/10 text-white/40'},m.model||'')
              ),
              h('div',{className:'mt-3 text-[14px] leading-relaxed text-white/90 whitespace-pre-wrap'},m.content)
            ))
          ),
          (synth||final)&&h('div',{className:'rounded-[20px] bg-white text-black p-6 shadow-2xl'},
            h('div',{className:'flex items-center gap-2 mb-3'},h('div',{className:'w-8 h-8 rounded-full bg-black text-white grid place-items-center font-bold'},'✓'),h('div',{className:'font-bold'},flow===1?'Tổng hợp đa chiều':'Kết luận cuối cùng'),h('div',{className:'ml-auto text-[11px] px-2 py-1 rounded-full bg-black/5 border border-black/10'},new Date().toLocaleTimeString())),
            h('div',{className:'whitespace-pre-wrap text-[14px] leading-relaxed'},synth||final),
            h('div',{className:'mt-4 flex gap-2'},h('button',{onClick:()=>{navigator.clipboard.writeText(synth||final);},className:'px-3 py-1.5 rounded-full bg-black text-white text-xs'},'Copy'),h('a',{href:'/docs',target:'_blank',className:'px-3 py-1.5 rounded-full bg-black/5 border border-black/10 text-xs'},'Xem API'))
          )
        )
      ),
      h('div',{className:'mt-12 text-center text-[11px] text-white/20'},'Council AI V20 • V14.8 FINAL Flat • Sang 3/9/2026 • Dual Flow + Local Memory + Real API')
    )
  )
}

root.render(h(App));
</script>
